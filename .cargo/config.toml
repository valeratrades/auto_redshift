[build]
rustc-wrapper = "kache"

[profile.rust]
codegen-backend = "cranelift"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold", "--cfg", "tokio_unstable", "-Z", "threads=8", "-Z", "track-diagnostics", "--cfg", "web_sys_unstable_apis"]

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))']
rustflags = "-C link-arg=-fuse-ld=mold --cfg tokio_unstable -Z threads=8 -Z track-diagnostics"
