[package]
name = "auto_redshift"
version = "0.1.2"
edition = "2021"
description = "Shift wlroots display temperature and brightness through the day, relative to your waketime"
license-file = "LICENSE"
repository = "https://github.com/valeratrades/auto_redshift"
include = ["src/**/*", "LICENSE", "README.md", ".cargo/*", "build.rs"]

[package.metadata.cargo-machete]
ignored = ["color-eyre", "miette"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
clap = { version = "^4.5.54", features = ["derive"] }
color-eyre = "0.6"
config = "0.15.19"
ctrlc = "3.5.2"
jiff = "0.2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1"
v_utils = { version = "^2.23.0", features = ["io", "macros", "cli", "tracing", "xdg"] }

[dev-dependencies]
insta = "1.46"

#? still not sure if these do anything
[lints.clippy]
get_first = "allow"
len_zero = "allow"

[lints.rust]
unused_features = "allow"

[lints.cargo]
non_kebab_case_bins = "allow"
